services:
    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: foodhubdb
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        networks:
            - app-network

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        env_file:
            - ./backend/.env
        ports:
            - "4000:4000"
        volumes:
            - ./backend:/app
            - ./shared:/app/shared
            - backend_node_modules:/app/node_modules
        depends_on:
            - db
        networks:
            - app-network
        dns:
            - 8.8.8.8
            - 8.8.4.4
        command: sh -c "npx prisma migrate dev && npx prisma generate && npm run dev"

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        ports:
            - "3000:3000"
        volumes:
            - ./frontend:/app
            - ./shared:/app/shared
            - frontend_node_modules:/app/node_modules
            - frontend_next:/app/.next
        environment:
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true" # Better file watching
        networks:
            - app-network

volumes:
    postgres_data:
    backend_node_modules:
    frontend_node_modules:
    frontend_next:

networks:
    app-network:
        driver: bridge
