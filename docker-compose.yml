services:
    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: foodhubdb
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        networks:
            - app-network

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        env_file:
            - ./backend/.env
        ports:
            - "4000:4000"
        volumes:
            - ./backend:/app
            - ./shared:/app/shared
            - /app/node_modules
        depends_on:
            - db
        networks:
            - app-network
        dns:
            - 8.8.8.8
            - 8.8.4.4
            - 1.1.1.1
        sysctls:
            - net.ipv6.conf.all.disable_ipv6=0
        command: sh -c "npx prisma migrate dev && npx prisma generate && npm run dev"

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        ports:
            - "3000:3000"
        volumes:
            - ./frontend:/app
            - ./shared:/app/shared
            - /app/node_modules
        environment:
            CHOKIDAR_USEPOLLING: "true"
        stdin_open: true
        tty: true
        networks:
            - app-network

volumes:
    postgres_data:

networks:
    app-network:
        driver: bridge
        driver_opts:
            com.docker.network.bridge.name: br-foodhub
